apiVersion: v1
kind: ConfigMap
metadata:
  name: sqlserver-init
  namespace: dotnet-stack
data:
  entrypoint.sh: |
    #!/bin/bash
    
    # Start SQL Server in background
    /opt/mssql/bin/sqlservr &
    
    # Wait for SQL Server to start
    echo "Waiting for SQL Server to start..."
    sleep 30s
    
    # Run initialization script
    echo "Initializing database..."
    /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C << EOF
    IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'IncidentDB')
    BEGIN
        CREATE DATABASE IncidentDB;
    END
    GO
    
    USE IncidentDB;
    GO
    
    -- Create unified incidents table (matches Python/PostgreSQL schema)
    -- Primary identifier: request_id (from logs, matches across both stacks)
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'incidents')
    BEGIN
        CREATE TABLE incidents (
            id INT IDENTITY(1,1),
            request_id NVARCHAR(100) PRIMARY KEY,
            email NVARCHAR(200),
            description NVARCHAR(MAX),
            category NVARCHAR(100),
            severity NVARCHAR(20),
            pod_id NVARCHAR(50),
            duration_seconds FLOAT,
            source NVARCHAR(20),
            created_at DATETIME2 DEFAULT GETUTCDATE(),
            updated_at DATETIME2
        );
        CREATE INDEX idx_incidents_created_at ON incidents(created_at DESC);
        CREATE INDEX idx_incidents_source ON incidents(source);
        PRINT 'Table incidents created';
    END
    GO
    
    -- Keep old table for backward compatibility (optional)
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'support_tickets')
    BEGIN
        CREATE TABLE support_tickets (
            id INT IDENTITY(1,1) PRIMARY KEY,
            ticket_id NVARCHAR(50) UNIQUE NOT NULL,
            title NVARCHAR(200),
            description NVARCHAR(MAX),
            severity NVARCHAR(20),
            status NVARCHAR(20),
            created_at DATETIME2 DEFAULT GETUTCDATE(),
            updated_at DATETIME2 DEFAULT GETUTCDATE()
        );
        PRINT 'Table support_tickets created';
    END
    GO
    
    IF NOT EXISTS (SELECT * FROM sys.tables WHERE name = 'pattern_events')
    BEGIN
        CREATE TABLE pattern_events (
            id INT IDENTITY(1,1) PRIMARY KEY,
            pattern_name NVARCHAR(50) NOT NULL,
            event_details NVARCHAR(MAX),
            created_at DATETIME2 DEFAULT GETUTCDATE()
        );
        PRINT 'Table pattern_events created';
    END
    GO
    
    PRINT 'Database initialization complete';
    GO
    EOF
    
    echo "Database initialized successfully"
    
    # Keep SQL Server running in foreground
    wait
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: dotnet-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        env:
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dotnet-secrets
              key: sql-password
        - name: MSSQL_PID
          value: "Express"
        command: ["/bin/bash"]
        args: ["/scripts/entrypoint.sh"]
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: init-scripts
          mountPath: /scripts
        - name: sqlserver-data
          mountPath: /var/opt/mssql
      volumes:
      - name: init-scripts
        configMap:
          name: sqlserver-init
          defaultMode: 0755
      - name: sqlserver-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-service
  namespace: dotnet-stack
spec:
  selector:
    app: sqlserver
  ports:
  - protocol: TCP
    port: 1433
    targetPort: 1433
  type: ClusterIP