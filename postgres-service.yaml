# ──────────────────────────────────────────────────────────────────────────────
# postgres-service.yaml
# PostgreSQL: ConfigMap (init SQL), Service, and Deployment.
# ──────────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    -- ══════════════════════════════════════════════════════════════════════════
    -- PostgreSQL Initialization Script
    -- Creates unified schema matching SQL Server for dual-stack consistency
    -- ══════════════════════════════════════════════════════════════════════════

    -- ══════════════════════════════════════════════════════════════════════════
    -- TABLE: incidents (unified schema for both Python and .NET)
    -- Primary identifier: request_id (from logs, NOT auto-increment)
    -- ══════════════════════════════════════════════════════════════════════════
    CREATE TABLE IF NOT EXISTS incidents (
        id                      SERIAL,
        request_id              VARCHAR(100)  PRIMARY KEY,  -- From message/logs (e.g., 'abc123' or UUID)
        email                   VARCHAR(200),
        description             TEXT,
        category                VARCHAR(100),
        pod_id                  VARCHAR(50),
        duration_seconds        FLOAT,
        source                  VARCHAR(20)   DEFAULT 'python',  -- 'python' or 'dotnet'
        created_at              TIMESTAMP     DEFAULT CURRENT_TIMESTAMP,
        updated_at              TIMESTAMP
    );

    -- Indexes for performance
    CREATE INDEX IF NOT EXISTS idx_incidents_created_at ON incidents(created_at DESC);
    CREATE INDEX IF NOT EXISTS idx_incidents_source ON incidents(source);
    CREATE INDEX IF NOT EXISTS idx_incidents_pod_id ON incidents(pod_id);

    -- ══════════════════════════════════════════════════════════════════════════
    -- TABLE: pattern_events (for tracking message flow patterns)
    -- ══════════════════════════════════════════════════════════════════════════
    CREATE TABLE IF NOT EXISTS pattern_events (
        id          SERIAL        PRIMARY KEY,
        request_id  VARCHAR(100)  NOT NULL,
        pattern     VARCHAR(50)   NOT NULL,   -- default | fanout | direct | topic | dlq | ttl | priority | ack_mode
        exchange    VARCHAR(100)  NOT NULL,
        routing_key VARCHAR(200)  NOT NULL,
        outcome     VARCHAR(200)  NOT NULL,
        created_at  TIMESTAMP     DEFAULT CURRENT_TIMESTAMP
    );

    CREATE INDEX IF NOT EXISTS idx_pattern_events_request_id ON pattern_events(request_id);

    -- ══════════════════════════════════════════════════════════════════════════
    -- TABLE: support_tickets (legacy/backup table - kept for compatibility)
    -- ══════════════════════════════════════════════════════════════════════════
    CREATE TABLE IF NOT EXISTS support_tickets (
        request_id                  SERIAL        PRIMARY KEY,
        requester_email             VARCHAR(255)  NOT NULL,
        issue_description           TEXT          NOT NULL,
        categorization              VARCHAR(100)  DEFAULT 'Pending',
        status                      VARCHAR(50)   DEFAULT 'Queued',
        handled_by_pod              VARCHAR(100),
        processing_duration_seconds FLOAT,
        created_at                  TIMESTAMP     DEFAULT CURRENT_TIMESTAMP
    );

    -- ══════════════════════════════════════════════════════════════════════════
    -- STORED PROCEDURES
    -- ══════════════════════════════════════════════════════════════════════════

    -- ── SP 1: Insert incident (unified procedure for both stacks) ────────────
    CREATE OR REPLACE PROCEDURE create_incident_ticket(
        p_request_id VARCHAR,
        p_email      VARCHAR,
        p_desc       TEXT,
        p_category   VARCHAR,
        p_pod        VARCHAR,
        p_duration   FLOAT
    )
    LANGUAGE plpgsql AS $$
    BEGIN
        INSERT INTO incidents
            (request_id, email, description, category, pod_id, duration_seconds, source, created_at)
        VALUES
            (p_request_id, p_email, p_desc, p_category, p_pod, p_duration, 'python', CURRENT_TIMESTAMP)
        ON CONFLICT (request_id) DO UPDATE
            SET updated_at = CURRENT_TIMESTAMP;
    END;
    $$;

    -- ── SP 2: Log pattern event ──────────────────────────────────────────────
    CREATE OR REPLACE PROCEDURE log_pattern_event(
        p_request_id  VARCHAR,
        p_pattern     VARCHAR,
        p_exchange    VARCHAR,
        p_routing_key VARCHAR,
        p_outcome     VARCHAR
    )
    LANGUAGE plpgsql AS $$
    BEGIN
        INSERT INTO pattern_events (request_id, pattern, exchange, routing_key, outcome)
        VALUES (p_request_id, p_pattern, p_exchange, p_routing_key, p_outcome);
    END;
    $$;

    -- ── SP 3: Admin cleanup ──────────────────────────────────────────────────
    CREATE OR REPLACE PROCEDURE admin_clear_database()
    LANGUAGE plpgsql AS $$
    BEGIN
        TRUNCATE TABLE incidents        RESTART IDENTITY CASCADE;
        TRUNCATE TABLE pattern_events   RESTART IDENTITY CASCADE;
        TRUNCATE TABLE support_tickets  RESTART IDENTITY CASCADE;
    END;
    $$;

    -- ══════════════════════════════════════════════════════════════════════════
    -- FUNCTIONS (for querying/analytics)
    -- ══════════════════════════════════════════════════════════════════════════

    -- ── FN 1: Get user ticket history ────────────────────────────────────────
    CREATE OR REPLACE FUNCTION get_user_ticket_history(p_email VARCHAR)
    RETURNS TABLE (
        req_id       VARCHAR,
        desc_text    TEXT,
        cat          VARCHAR,
        pod          VARCHAR,
        duration     FLOAT,
        created      TIMESTAMP
    )
    LANGUAGE plpgsql AS $$
    BEGIN
        RETURN QUERY
        SELECT request_id, description, category, pod_id, duration_seconds, created_at
        FROM   incidents
        WHERE  email = p_email
        ORDER  BY created_at DESC;
    END;
    $$;

    -- ── FN 2: Get recent tickets ─────────────────────────────────────────────
    CREATE OR REPLACE FUNCTION get_recent_tickets(p_limit INT DEFAULT 50)
    RETURNS TABLE (
        req_id    VARCHAR,
        email_    VARCHAR,
        cat       VARCHAR,
        source_   VARCHAR,
        created   TIMESTAMP
    )
    LANGUAGE plpgsql AS $$
    BEGIN
        RETURN QUERY
        SELECT request_id, email, category, source, created_at
        FROM   incidents
        ORDER  BY created_at DESC
        LIMIT  p_limit;
    END;
    $$;

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    protocol: TCP
    port: 5432
    targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deployment
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: password
        - name: POSTGRES_DB
          value: incidents
        ports:
        - name: postgres
          containerPort: 5432
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        volumeMounts:
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d/
      volumes:
      - name: init-script
        configMap:
          name: postgres-init-script
